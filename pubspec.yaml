name: hotel_floor_planner
description: A simple hotel floor and room management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  excel: ^4.0.6
  share_plus: ^7.2.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/bedlogo.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#0B7A3D"
  image: lib/bedlogosmall.png
  android_12:
    color: "0B7A3D"
    image: lib/bedlogosmall.png
  fullscreen: true